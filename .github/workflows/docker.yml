name: Docker
on:
  push:
    branches: [development]
  workflow_call:
    inputs:
      tag:
        description: image tag (the release version); empty on development pushes, which publish latest
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  ci:
    if: inputs.tag == ''
    uses: ./.github/workflows/ci.yml
  image:
    needs: ci
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    concurrency:
      group: docker-${{ inputs.tag || 'latest' }}
      cancel-in-progress: ${{ inputs.tag == '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag || 'latest' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag || 'latest' }}
          build-args: |
            VERSION=${{ inputs.tag || 'latest' }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
