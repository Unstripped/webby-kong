name: CI
on:
  push:
    branches: [development]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rom-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_no_roms.py
  patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/prepare.py check
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Python syntax
        run: python -m compileall -q tools tests/tools
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Web unit tests
        run: npm test
      - name: Shell syntax
        run: sh -n .githooks/pre-commit
      - name: Server requirements
        run: pip install -r tools/requirements-server.txt
      - name: Unit tests
        run: python -m unittest discover -s tests/tools -v
      - name: Helm chart
        run: |
          helm lint --strict charts/webby-kong
          helm lint --strict charts/webby-kong --set auth.enabled=true --set auth.externalUrl=https://kong.example.com \
            --set smtp.host=smtp.example.com --set smtp.password=x --set ingress.enabled=true \
            --set rom.volume.hostPath.path=/roms --set rom.subPath=dk64.z64
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Server requirements
        run: pip install -r tools/requirements-server.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the page
        run: npm run build
      - name: End-to-end tests (no ROM)
        run: npm run test:e2e
