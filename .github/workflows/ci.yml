name: CI
on:
  push:
    branches: [development]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rom-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_no_roms.py
  patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/prepare.py check
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Python syntax
        run: python -m compileall -q tools tests/tools
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Web unit tests
        run: npm test
      - name: Shell syntax
        run: sh -n .githooks/pre-commit
      - name: Server requirements
        run: pip install -r tools/requirements-server.txt
      - name: Unit tests
        run: python -m unittest discover -s tests/tools -v
      - name: Helm chart
        run: |
          helm lint --strict charts/webby-kong
          helm lint --strict charts/webby-kong --set auth.enabled=true --set auth.externalUrl=https://kong.example.com \
            --set smtp.host=smtp.example.com --set smtp.password=x --set ingress.enabled=true \
            --set rom.volume.hostPath.path=/roms --set rom.subPath=dk64.z64
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Server requirements
        run: pip install -r tools/requirements-server.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the page
        run: npm run build
      - name: End-to-end tests (no ROM)
        run: npm run test:e2e
  # The Windows job runs only when a change can affect what `mise run sync` / `mise run serve` execute natively on
  # Windows; keep PATTERN in step with tools/sync.py, tools/prepare.py and CMakeLists.txt. Skipped counts as passed.
  windows-changes:
    runs-on: ubuntu-24.04
    outputs:
      tooling: ${{ steps.diff.outputs.tooling }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          PATTERN: '^(\.gitattributes|\.gitmodules|decomp|mise\.toml|CMakeLists\.txt|package(-lock)?\.json|vite\.config\.ts|\.github/workflows/ci\.yml|tools/(sync|prepare|gen_data|asyncify_remove|link_check|serve|saves)\.py|tools/requirements[^/]*\.txt|tools/auth/.+)$'
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;  # the PR merge commit's first parent is the base branch
            push) base=$BEFORE ;;         # main pushes too: release.yml calls this workflow
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            hits=$(git diff --name-only "$base" HEAD | grep -E "$PATTERN" || true)
          else
            hits="(no comparable base for $GITHUB_EVENT_NAME: running anyway)"
          fi
          echo "tooling=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf 'Windows-relevant changes:\n%s\n' "${hits:-(none)}"
  windows:
    name: Windows (mise run sync + serve)
    needs: windows-changes
    if: needs.windows-changes.outputs.tooling == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Git settings under test (runner defaults, kept on purpose)
        shell: bash
        run: |
          git config --show-origin --get-all core.autocrlf || true
          git config --show-origin --get-all core.symlinks || true
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: jdx/mise-action@v5
        with:
          cache_save_post: true  # also keep the emscripten cache the first build fills
      - name: mise run sync
        shell: bash
        run: mise run sync -- --no-pull
      - name: mise run serve (smoke test)
        shell: python
        run: |
          import subprocess, time, urllib.request
          from pathlib import Path

          LOG = Path("build/ci-serve.log")

          def get(path):
              with urllib.request.urlopen("http://localhost:8080" + path, timeout=10) as r:
                  return r.read()

          with LOG.open("w") as log:
              server = subprocess.Popen("mise run --skip-deps serve -- --port 8080 --db build/ci-saves.sqlite3",
                                        shell=True, stdout=log, stderr=subprocess.STDOUT)
          try:
              for _ in range(60):
                  try:
                      get("/")
                      break
                  except OSError:
                      if server.poll() is not None:
                          break
                      time.sleep(2)
              assert b"<title>Donkey Kong 64 (web)</title>" in get("/"), "/ is not the game page"
              assert b'"saves"' in get("/api/saves"), "/api/saves did not answer with the save list"
              assert get("/dk64.wasm")[:4] == b"\0asm", "/dk64.wasm is not a wasm module"
              print("serve smoke test passed")
          finally:
              subprocess.run(["taskkill", "/F", "/T", "/PID", str(server.pid)], capture_output=True)
              print(LOG.read_text(errors="replace"))
