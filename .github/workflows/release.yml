name: Release
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          echo "tag=$(python3 tools/next_version.py)" >> "$GITHUB_OUTPUT"
          echo "previous=$(python3 tools/next_version.py --previous)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.version.outputs.previous }}
        run: |
          {
            echo "Source release of webby-kong. No game data or build output is attached: build it with [docs/building.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/building.md) (no ROM needed), or run the Docker image \`ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}\` with your own Donkey Kong 64 (USA) ROM mounted at \`/rom\`."
            echo
            echo "GitHub source archives omit the \`decomp/\` submodule; use \`git clone --recursive --branch $TAG https://github.com/$GITHUB_REPOSITORY.git\`."
            echo
            echo "## Changes${PREV:+ since $PREV}"
            git log --no-merges --format='- %s (%h)' "${PREV:+$PREV..}HEAD"
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
  docker:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
