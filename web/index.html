<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donkey Kong 64 (web)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #canvas { aspect-ratio: 4 / 3; max-width: 100vw; max-height: 100vh; width: 100vw; background: #000; outline: none; }
  #ui { position: fixed; top: 8px; left: 8px; z-index: 1; }
  #status { margin-left: 8px; }
</style>
</head>
<body>
<div id="ui">
  <label>ROM (Donkey Kong 64 USA): <input type="file" id="rom" accept=".z64,.n64,.v64"></label>
  <span id="status">Select your ROM to start.</span>
</div>
<div id="wrap"><canvas id="canvas" width="960" height="720" tabindex="-1"></canvas></div>
<script src="dk64.js"></script>
<script src="main.js"></script>
</body>
</html>
