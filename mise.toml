[tools]
python = "3.12.14"
node = "24.22.0"
cmake = "4.5.0"
ninja = "1.13.2"
emsdk = "6.0.13"

[env]
# Local settings for `mise run serve` (WEBBY_KONG_* variables, see .env.example). Missing file = no overrides, so a
# fresh clone runs with the defaults. The same file feeds the image: docker run --env-file .env ...
_.file = ".env"

[tasks.sync]
description = "Pull, update decomp/, tools/.venv, build/tree, build/gen and build/web; skips what is current (tools/sync.py)"
run = "python tools/sync.py"

[tasks.serve]
description = "Sync (mise run sync), then serve build/web with the save API and the optional passkey gate (same settings as the Docker image)"
depends = ["sync"]
run = 'exec tools/.venv/bin/python tools/serve.py "$@"'
